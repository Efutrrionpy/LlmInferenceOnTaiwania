<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Continuous batching and attention backend throughput</title>
  <desc id="desc">Line chart comparing stock XFormers and FLASH_ATTN_V100 throughput from concurrency 1 to 512.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #111827; font-size: 13px; }
    .title { font-size: 20px; font-weight: 700; }
    .subtitle { fill: #4b5563; font-size: 13px; }
    .axis { stroke: #d1d5db; stroke-width: 1; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .stock { stroke: #64748b; stroke-width: 3; fill: none; }
    .flash { stroke: #2563eb; stroke-width: 3; fill: none; }
    .dot-stock { fill: #64748b; }
    .dot-flash { fill: #2563eb; }
  </style>
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="30" y="34" class="title">Continuous batching and attention backend</text>
  <text x="30" y="56" class="subtitle">Batching exposes enough work for the V100-compatible FlashAttention backend to matter.</text>

  <line x1="70" y1="310" x2="790" y2="310" class="axis"/>
  <line x1="70" y1="60" x2="70" y2="310" class="axis"/>
  <line x1="70" y1="248" x2="790" y2="248" class="grid"/>
  <line x1="70" y1="185" x2="790" y2="185" class="grid"/>
  <line x1="70" y1="123" x2="790" y2="123" class="grid"/>
  <line x1="70" y1="60" x2="790" y2="60" class="grid"/>
  <text x="36" y="314">0</text>
  <text x="22" y="252">100</text>
  <text x="22" y="189">200</text>
  <text x="22" y="127">300</text>
  <text x="22" y="64">400</text>
  <text x="338" y="392">Concurrency</text>
  <text x="16" y="52">tok/s</text>

  <polyline class="stock" points="70,305 150,302 230,295 310,283 390,270 470,260 550,245 630,235 710,232 790,233"/>
  <polyline class="flash" points="70,306 150,301 230,294 310,283 390,274 470,258 550,231 630,179 710,122 790,72"/>

  <circle cx="70" cy="305" r="4" class="dot-stock"/><circle cx="150" cy="302" r="4" class="dot-stock"/><circle cx="230" cy="295" r="4" class="dot-stock"/><circle cx="310" cy="283" r="4" class="dot-stock"/><circle cx="390" cy="270" r="4" class="dot-stock"/><circle cx="470" cy="260" r="4" class="dot-stock"/><circle cx="550" cy="245" r="4" class="dot-stock"/><circle cx="630" cy="235" r="4" class="dot-stock"/><circle cx="710" cy="232" r="4" class="dot-stock"/><circle cx="790" cy="233" r="4" class="dot-stock"/>
  <circle cx="70" cy="306" r="4" class="dot-flash"/><circle cx="150" cy="301" r="4" class="dot-flash"/><circle cx="230" cy="294" r="4" class="dot-flash"/><circle cx="310" cy="283" r="4" class="dot-flash"/><circle cx="390" cy="274" r="4" class="dot-flash"/><circle cx="470" cy="258" r="4" class="dot-flash"/><circle cx="550" cy="231" r="4" class="dot-flash"/><circle cx="630" cy="179" r="4" class="dot-flash"/><circle cx="710" cy="122" r="4" class="dot-flash"/><circle cx="790" cy="72" r="4" class="dot-flash"/>

  <text x="62" y="334">1</text>
  <text x="142" y="334">2</text>
  <text x="222" y="334">4</text>
  <text x="302" y="334">8</text>
  <text x="379" y="334">16</text>
  <text x="459" y="334">32</text>
  <text x="539" y="334">64</text>
  <text x="618" y="334">128</text>
  <text x="698" y="334">256</text>
  <text x="778" y="334">512</text>

  <rect x="575" y="28" width="18" height="4" fill="#64748b"/>
  <text x="602" y="34">XFormers / stock</text>
  <rect x="575" y="50" width="18" height="4" fill="#2563eb"/>
  <text x="602" y="56">FLASH_ATTN_V100</text>
  <text x="720" y="70" fill="#2563eb" font-weight="700">380.04</text>
  <text x="720" y="226" fill="#64748b" font-weight="700">124.30</text>
  <text x="605" y="372" class="subtitle">c=256 and c=512 use eager high-pressure runs.</text>
</svg>
