<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
  <title id="title">Estimated model FLOP utilization</title>
  <desc id="desc">Bar chart showing estimated MFU for optimized TP=16 PP=1 IB/GDRDMA runs at selected concurrency levels.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #111827; font-size: 13px; }
    .title { font-size: 20px; font-weight: 700; }
    .subtitle { fill: #4b5563; font-size: 13px; }
    .axis { stroke: #d1d5db; stroke-width: 1; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
  </style>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="30" y="34" class="title">Estimated MFU against the V100 compute roof</text>
  <text x="30" y="56" class="subtitle">MFU estimate assumes 2 x 405B FLOPs per generated token and 16 x 125 TFLOP/s V100 tensor-core peak.</text>

  <line x1="90" y1="310" x2="790" y2="310" class="axis"/>
  <line x1="90" y1="70" x2="90" y2="310" class="axis"/>
  <line x1="90" y1="230" x2="790" y2="230" class="grid"/>
  <line x1="90" y1="150" x2="790" y2="150" class="grid"/>
  <line x1="90" y1="70" x2="790" y2="70" class="grid"/>
  <text x="58" y="314">0%</text>
  <text x="50" y="234">10%</text>
  <text x="50" y="154">20%</text>
  <text x="50" y="74">30%</text>

  <rect x="150" y="196" width="90" height="114" rx="5" fill="#94a3b8"/>
  <rect x="315" y="117" width="90" height="193" rx="5" fill="#60a5fa"/>
  <rect x="480" y="104" width="90" height="206" rx="5" fill="#2563eb"/>
  <rect x="645" y="100" width="90" height="210" rx="5" fill="#7c3aed"/>

  <text x="166" y="190" font-weight="700">14.2%</text>
  <text x="331" y="111" font-weight="700">24.1%</text>
  <text x="496" y="98" font-weight="700">25.8%</text>
  <text x="661" y="94" font-weight="700">26.3%</text>

  <text x="160" y="334">c=128</text>
  <text x="325" y="334">c=512</text>
  <text x="490" y="334">c=640</text>
  <text x="655" y="334">c=768</text>
  <text x="182" y="356" class="subtitle">284.8 TFLOP/s</text>
  <text x="347" y="356" class="subtitle">482.7 TFLOP/s</text>
  <text x="512" y="356" class="subtitle">516.3 TFLOP/s</text>
  <text x="677" y="356" class="subtitle">526.8 TFLOP/s</text>
</svg>
