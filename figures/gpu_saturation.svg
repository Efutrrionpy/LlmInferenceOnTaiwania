<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">High-concurrency saturation sweep</title>
  <desc id="desc">Bar and line chart showing aggregate throughput and average GPU utilization for optimized TP=16 PP=1 IB/GDRDMA runs.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #111827; font-size: 13px; }
    .title { font-size: 20px; font-weight: 700; }
    .subtitle { fill: #4b5563; font-size: 13px; }
    .axis { stroke: #d1d5db; stroke-width: 1; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .util { stroke: #f97316; stroke-width: 3; fill: none; }
  </style>
  <rect width="900" height="440" fill="#ffffff"/>
  <text x="30" y="34" class="title">High-concurrency saturation sweep</text>
  <text x="30" y="56" class="subtitle">Throughput continues to rise, but after c=640 the gain is small relative to latency.</text>

  <line x1="80" y1="330" x2="790" y2="330" class="axis"/>
  <line x1="80" y1="90" x2="80" y2="330" class="axis"/>
  <line x1="790" y1="90" x2="790" y2="330" class="axis"/>
  <line x1="80" y1="261" x2="790" y2="261" class="grid"/>
  <line x1="80" y1="193" x2="790" y2="193" class="grid"/>
  <line x1="80" y1="124" x2="790" y2="124" class="grid"/>

  <text x="40" y="334">0</text>
  <text x="26" y="265">200</text>
  <text x="26" y="197">400</text>
  <text x="26" y="128">600</text>
  <text x="14" y="78">tok/s</text>
  <text x="802" y="334">0%</text>
  <text x="802" y="265">29%</text>
  <text x="802" y="197">57%</text>
  <text x="802" y="128">86%</text>
  <text x="802" y="94">100%</text>

  <rect x="92" y="212" width="70" height="118" rx="4" fill="#2563eb"/>
  <rect x="242" y="205" width="70" height="125" rx="4" fill="#2563eb"/>
  <rect x="392" y="126" width="70" height="204" rx="4" fill="#2563eb"/>
  <rect x="542" y="112" width="70" height="218" rx="4" fill="#2563eb"/>
  <rect x="692" y="107" width="70" height="223" rx="4" fill="#2563eb"/>

  <polyline class="util" points="127,120 277,115 427,106 577,106 727,103"/>
  <circle cx="127" cy="120" r="5" fill="#f97316"/>
  <circle cx="277" cy="115" r="5" fill="#f97316"/>
  <circle cx="427" cy="106" r="5" fill="#f97316"/>
  <circle cx="577" cy="106" r="5" fill="#f97316"/>
  <circle cx="727" cy="103" r="5" fill="#f97316"/>

  <text x="105" y="354">c=128</text>
  <text x="255" y="354">c=160</text>
  <text x="405" y="354">c=512</text>
  <text x="555" y="354">c=640</text>
  <text x="705" y="354">c=768</text>
  <text x="102" y="202" fill="#ffffff" font-weight="700">342.9</text>
  <text x="402" y="116" fill="#ffffff" font-weight="700">595.9</text>
  <text x="552" y="102" fill="#ffffff" font-weight="700">637.4</text>
  <text x="702" y="97" fill="#ffffff" font-weight="700">650.3</text>

  <rect x="540" y="28" width="18" height="12" rx="2" fill="#2563eb"/>
  <text x="566" y="39">Aggregate tok/s</text>
  <line x1="540" y1="56" x2="558" y2="56" stroke="#f97316" stroke-width="3"/>
  <text x="566" y="61">All-GPU average utilization</text>
  <text x="742" y="100" fill="#f97316" font-weight="700">94.5%</text>
</svg>
